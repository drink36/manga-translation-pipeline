[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "manga-translation-pipeline"
version = "0.1.0"
description = "Resumable manga OCR, Traditional Chinese translation, and rendering"
requires-python = ">=3.11"
dependencies = ["Pillow>=10.3", "numpy>=1.26", "PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest>=8"]
layout = ["rfdetr==1.7.0", "safetensors>=0.8", "huggingface-hub>=1.5,<2"]
manga = ["manga-ocr==0.1.16", "transformers==5.16.0", "torch>=2.6", "torchvision"]
vl = ["transformers==5.16.0", "accelerate>=1", "torch>=2.6", "torchvision"]
english = ["paddleocr>=3.4,<4", "paddlepaddle>=3,<4"]

[project.scripts]
manga-pipeline = "manga_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
