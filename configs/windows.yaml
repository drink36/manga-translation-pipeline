# Native Windows, one RTX 5070 (12 GB): llama.cpp serves Qwen3.5-9B as a 4-bit GGUF
# (~6.6 GB with its vision projector, so it fits beside desktop apps); layout/OCR stay
# on CPU. Setup: README "Run on Windows". Paths below resolve relative to THIS file.
extends: pipeline.yaml

vlm:
  model: unsloth/Qwen3.5-9B-GGUF:Q4_K_M   # served name (--alias), recorded in outputs
  revision: 3885219b6810b007914f3a7950a8d1b469d598a5   # pinned by `hf download`

server:
  backend: llama.cpp
  executable: ../bin/llama.cpp/llama-server.exe
  model_path: ../models/qwen3.5-9b/Qwen3.5-9B-Q4_K_M.gguf
  mmproj_path: ../models/qwen3.5-9b/mmproj-F16.gguf
  # Requests served at once; the pipeline runs that many pages concurrently in the
  # audit/reconcile/translate/qa stages. Measured on the 5070 vs 1 slot: 2 slots
  # 20-27% faster (~7.2 GB for Qwen at 16K), 4 slots 30-40% (~8.3 GB). 2 leaves room
  # for PaddleOCR on the GPU next to the desktop.
  max_num_seqs: 2
  # Context per slot. Largest request seen: 10.3K tokens (visual QA, two page images).
  max_model_len: 12288
  # host and port come from pipeline.yaml.

ocr:
  readers:
    paddle_english:
      # PaddlePaddle 3.3's oneDNN CPU path crashes here on PP-OCRv5 with
      # "ConvertPirAttribute2RuntimeAttribute not support"; plain CPU inference works.
      options: {enable_mkldnn: false}

render:
  font_path: C:/Windows/Fonts/msjh.ttc   # Microsoft JhengHei, bundled with Windows
  font_index: 0
